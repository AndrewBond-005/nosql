<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Библиотека — Сервис заявок</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; color: #333; }
        header { background: #2c3e50; color: #fff; padding: 16px 24px; }
        header h1 { font-size: 20px; font-weight: 600; }
        nav { display: flex; gap: 4px; background: #34495e; padding: 0 24px; }
        nav button { background: none; border: none; color: #95a5a6; padding: 12px 20px; cursor: pointer; font-size: 14px; border-bottom: 3px solid transparent; transition: all .15s; }
        nav button:hover { color: #ecf0f1; }
        nav button.active { color: #fff; border-bottom-color: #3498db; }
        main { max-width: 1100px; margin: 24px auto; padding: 0 16px; }
        .card { background: #fff; border-radius: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.1); overflow: hidden; margin-bottom: 20px; }
        .card-header { padding: 16px 20px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
        .card-header h2 { font-size: 16px; font-weight: 600; }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 10px 16px; border-bottom: 1px solid #f0f0f0; font-size: 14px; }
        th { background: #fafafa; font-weight: 600; color: #555; }
        tr:hover { background: #f8f9fa; }
        .badge { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: 500; }
        .badge-pending { background: #fff3cd; color: #856404; }
        .badge-confirmed { background: #d1ecf1; color: #0c5460; }
        .badge-completed { background: #d4edda; color: #155724; }
        .badge-cancelled { background: #f8d7da; color: #721c24; }
        .btn { padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500; transition: opacity .15s; }
        .btn:hover { opacity: .85; }
        .btn-primary { background: #3498db; color: #fff; }
        .btn-danger { background: #e74c3c; color: #fff; }
        .btn-success { background: #27ae60; color: #fff; }
        .btn-sm { padding: 5px 12px; font-size: 12px; }
        .actions { display: flex; gap: 6px; }
        .empty { padding: 40px; text-align: center; color: #999; }
        .section { display: none; }
        .section.active { display: block; }
        .form-row { display: flex; gap: 10px; align-items: end; padding: 16px 20px; background: #fafafa; border-top: 1px solid #eee; }
        .form-group { display: flex; flex-direction: column; gap: 4px; }
        .form-group label { font-size: 12px; font-weight: 600; color: #555; }
        .form-group input, .form-group select { padding: 7px 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 13px; }
        .counter { font-size: 24px; font-weight: 700; color: #3498db; }
        .counter-label { font-size: 12px; color: #999; }
        .stat-row { display: flex; gap: 24px; padding: 16px 20px; }
        .stat { text-align: center; }
        .view-btn { cursor: pointer; color: #3498db; font-weight: 600; }
        .view-btn:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <header>
        <h1>Библиотека — Сервис заявок</h1>
    </header>
    <nav>
        <button class="active" onclick="showSection('events', this)">События</button>
        <button onclick="showSection('orders', this)">Заказы</button>
        <button onclick="showSection('temp', this)">Временные заявки</button>
        <button onclick="showSection('managers', this)">Менеджеры</button>
        <button onclick="showSection('settings', this)">Настройки</button>
    </nav>
    <main>
        <!-- EVENTS -->
        <div id="events" class="section active">
            <div class="card">
                <div class="card-header">
                    <h2>Каталог событий</h2>
                    <button class="btn btn-primary" onclick="loadEvents()">Обновить</button>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>Название</th>
                            <th>Автор</th>
                            <th>Категория</th>
                            <th>Копии</th>
                            <th>Просмотры</th>
                            <th>Действия</th>
                        </tr>
                    </thead>
                    <tbody id="events-body"></tbody>
                </table>
            </div>
        </div>

        <!-- ORDERS -->
        <div id="orders" class="section">
            <div class="card">
                <div class="card-header">
                    <h2>Заказы</h2>
                    <button class="btn btn-primary" onclick="loadOrders()">Обновить</button>
                </div>
                <div class="form-row" id="order-form" style="display:none;">
                    <div class="form-group">
                        <label>Событие</label>
                        <select id="order-event"></select>
                    </div>
                    <div class="form-group">
                        <label>ID пользователя</label>
                        <input id="order-user" value="user01" />
                    </div>
                    <div class="form-group">
                        <label>Менеджер</label>
                        <select id="order-manager"></select>
                    </div>
                    <button class="btn btn-success" onclick="createOrder()">Оформить</button>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Событие</th>
                            <th>Пользователь</th>
                            <th>Менеджер</th>
                            <th>Статус</th>
                            <th>Действия</th>
                        </tr>
                    </thead>
                    <tbody id="orders-body"></tbody>
                </table>
            </div>
        </div>

        <!-- TEMP REQUESTS -->
        <div id="temp" class="section">
            <div class="card">
                <div class="card-header">
                    <h2>Временные заявки (Lease TTL)</h2>
                    <button class="btn btn-primary" onclick="loadTempRequests()">Обновить</button>
                </div>
                <div class="form-row" id="temp-form" style="display:none;">
                    <div class="form-group">
                        <label>Событие</label>
                        <select id="temp-event"></select>
                    </div>
                    <div class="form-group">
                        <label>ID пользователя</label>
                        <input id="temp-user" value="user01" />
                    </div>
                    <div class="form-group">
                        <label>TTL (сек)</label>
                        <input id="temp-ttl" type="number" value="30" min="5" max="300" />
                    </div>
                    <button class="btn btn-success" onclick="createTempRequest()">Создать</button>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Событие</th>
                            <th>Пользователь</th>
                            <th>Цель</th>
                            <th>Осталось</th>
                            <th>Действия</th>
                        </tr>
                    </thead>
                    <tbody id="temp-body"></tbody>
                </table>
            </div>
        </div>

        <!-- MANAGERS -->
        <div id="managers" class="section">
            <div class="card">
                <div class="card-header">
                    <h2>Менеджеры</h2>
                    <button class="btn btn-primary" onclick="loadManagers()">Обновить</button>
                </div>
                <div class="form-row" id="manager-form" style="display:none;">
                    <div class="form-group">
                        <label>Имя</label>
                        <input id="mgr-name" />
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input id="mgr-email" />
                    </div>
                    <button class="btn btn-success" onclick="createManager()">Добавить</button>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>Имя</th>
                            <th>Email</th>
                            <th>Активен</th>
                        </tr>
                    </thead>
                    <tbody id="managers-body"></tbody>
                </table>
            </div>
        </div>

        <!-- SETTINGS -->
        <div id="settings" class="section">
            <div class="card">
                <div class="card-header">
                    <h2>Настройки пользователя</h2>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>User ID</label>
                        <input id="set-user" value="user01" />
                    </div>
                    <button class="btn btn-primary" onclick="loadSettings()">Загрузить</button>
                </div>
                <div class="form-row" id="settings-fields" style="display:none;">
                    <div class="form-group">
                        <label>Категория</label>
                        <input id="set-cat" />
                    </div>
                    <div class="form-group">
                        <label>Язык</label>
                        <input id="set-lang" />
                    </div>
                    <div class="form-group">
                        <label>Уведомления</label>
                        <select id="set-notif">
                            <option value="true">Вкл</option>
                            <option value="false">Выкл</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Результатов на страницу</label>
                        <input id="set-perpage" type="number" />
                    </div>
                    <button class="btn btn-success" onclick="saveSettings()">Сохранить</button>
                </div>
            </div>
        </div>
    </main>

    <script>
        const API = '';
        let eventsCache = [];
        let managersCache = [];
        let tempTimer = null;

        function showSection(id, btn) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            btn.classList.add('active');
            if (id === 'events') loadEvents();
            if (id === 'orders') loadOrders();
            if (id === 'temp') loadTempRequests();
            if (id === 'managers') loadManagers();
        }

        async function api(url, opts) {
            const res = await fetch(API + url, opts);
            if (!res.ok) throw new Error(res.status);
            const text = await res.text();
            return text ? JSON.parse(text) : null;
        }

        // --- EVENTS ---
        async function loadEvents() {
            eventsCache = await api('/api/events');
            const tbody = document.getElementById('events-body');
            if (!eventsCache.length) { tbody.innerHTML = '<tr><td colspan="6" class="empty">Нет событий</td></tr>'; return; }
            tbody.innerHTML = eventsCache.map(e => `
                <tr>
                    <td><strong>${esc(e.title)}</strong><br><small style="color:#999">${esc(e.description||'')}</small></td>
                    <td>${esc(e.author)}</td>
                    <td>${esc(e.category)}</td>
                    <td>${e.availableCopies}</td>
                    <td><span class="view-btn" onclick="incView('${e.id}', this)">${e.viewCount}</span></td>
                    <td class="actions">
                        <button class="btn btn-danger btn-sm" onclick="deleteEvent('${e.id}')">Удалить</button>
                    </td>
                </tr>
            `).join('');
        }

        async function incView(id, el) {
            const count = await api(`/api/events/${id}/views`, { method: 'POST' });
            el.textContent = count;
        }

        async function deleteEvent(id) {
            if (!confirm('Удалить событие?')) return;
            await api(`/api/events/${id}`, { method: 'DELETE' });
            loadEvents();
        }

        // --- ORDERS ---
        async function loadOrders() {
            const [orders, evts, mgrs] = await Promise.all([
                api('/api/orders'),
                api('/api/events'),
                api('/api/managers')
            ]);
            eventsCache = evts;
            managersCache = mgrs;

            const sel1 = document.getElementById('order-event');
            sel1.innerHTML = evts.map(e => `<option value="${e.id}">${esc(e.title)}</option>`).join('');
            const sel2 = document.getElementById('order-manager');
            sel2.innerHTML = mgrs.map(m => `<option value="${m.id}">${esc(m.name)}</option>`).join('');
            document.getElementById('order-form').style.display = mgrs.length ? 'flex' : 'none';

            const tbody = document.getElementById('orders-body');
            const statusBadge = s => `<span class="badge badge-${s.toLowerCase()}">${s}</span>`;
            const evTitle = id => { const e = evts.find(x => x.id === id); return e ? esc(e.title) : id.slice(0,8); };
            const mName = id => { const m = mgrs.find(x => x.id === id); return m ? esc(m.name) : id.slice(0,8); };

            if (!orders.length) { tbody.innerHTML = '<tr><td colspan="6" class="empty">Нет заказов</td></tr>'; return; }
            tbody.innerHTML = orders.map(o => `
                <tr>
                    <td><small>${o.id.slice(0,8)}</small></td>
                    <td>${evTitle(o.eventId)}</td>
                    <td>${esc(o.userId)}</td>
                    <td>${mName(o.managerId)}</td>
                    <td>${statusBadge(o.status)}</td>
                    <td class="actions">
                        ${o.status === 'PENDING' ? `
                            <button class="btn btn-success btn-sm" onclick="updateOrder('${o.id}','CONFIRMED')">Подтвердить</button>
                            <button class="btn btn-danger btn-sm" onclick="updateOrder('${o.id}','CANCELLED')">Отменить</button>
                        ` : o.status === 'CONFIRMED' ? `
                            <button class="btn btn-primary btn-sm" onclick="updateOrder('${o.id}','COMPLETED')">Завершить</button>
                        ` : ''}
                    </td>
                </tr>
            `).join('');
        }

        async function createOrder() {
            const eventId = document.getElementById('order-event').value;
            const userId = document.getElementById('order-user').value;
            const managerId = document.getElementById('order-manager').value;
            if (!eventId || !userId || !managerId) { alert('Заполните все поля'); return; }
            await api(`/api/orders?managerId=${managerId}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ eventId, userId })
            });
            loadOrders();
        }

        async function updateOrder(id, status) {
            await api(`/api/orders/${id}/status?status=${status}`, { method: 'PUT' });
            loadOrders();
        }

        // --- TEMP REQUESTS ---
        let tempExpiredFired = {};

        async function loadTempRequests() {
            tempExpiredFired = {};
            if (tempTimer) { clearInterval(tempTimer); tempTimer = null; }
            const [reqs, evts] = await Promise.all([
                api('/api/temp-requests'),
                api('/api/events')
            ]);
            eventsCache = evts;

            const sel = document.getElementById('temp-event');
            sel.innerHTML = evts.map(e => `<option value="${e.id}">${esc(e.title)}</option>`).join('');
            document.getElementById('temp-form').style.display = evts.length ? 'flex' : 'none';

            const tbody = document.getElementById('temp-body');
            if (!reqs.length) { tbody.innerHTML = '<tr><td colspan="6" class="empty">Нет временных заявок</td></tr>'; return; }

            const evTitle = id => { const e = evts.find(x => x.id === id); return e ? esc(e.title) : id.slice(0,8); };

            tbody.innerHTML = reqs.map(r => `
                <tr data-id="${r.id}" data-expires="${r.expiresAt}">
                    <td><small>${r.id.slice(0,8)}</small></td>
                    <td>${evTitle(r.eventId)}</td>
                    <td>${esc(r.userId)}</td>
                    <td>${esc(r.purpose)}</td>
                    <td class="ttl-cell"></td>
                    <td class="actions">
                        <button class="btn btn-danger btn-sm" onclick="deleteTempRequest('${r.id}')">Удалить</button>
                    </td>
                </tr>
            `).join('');

            updateTtlCells();
            tempTimer = setInterval(updateTtlCells, 1000);
        }

        function updateTtlCells() {
            let anyExpired = false;
            document.querySelectorAll('#temp-body tr[data-expires]').forEach(row => {
                const expires = new Date(row.dataset.expires);
                const now = new Date();
                const diff = Math.max(0, Math.floor((expires - now) / 1000));
                const cell = row.querySelector('.ttl-cell');
                if (diff <= 0) {
                    cell.textContent = 'Истёк';
                    cell.style.color = '#e74c3c';
                    cell.style.fontWeight = '600';
                    if (!tempExpiredFired[row.dataset.id]) {
                        tempExpiredFired[row.dataset.id] = true;
                        anyExpired = true;
                    }
                } else {
                    const m = Math.floor(diff / 60);
                    const s = diff % 60;
                    cell.textContent = `${m}:${String(s).padStart(2,'0')}`;
                    cell.style.color = diff <= 10 ? '#e74c3c' : '#27ae60';
                    cell.style.fontWeight = diff <= 10 ? '600' : '400';
                }
            });
            if (anyExpired) {
                if (tempTimer) { clearInterval(tempTimer); tempTimer = null; }
                loadTempRequests();
            }
        }

        async function createTempRequest() {
            const eventId = document.getElementById('temp-event').value;
            const userId = document.getElementById('temp-user').value;
            const ttl = document.getElementById('temp-ttl').value;
            if (!eventId || !userId) { alert('Заполните все поля'); return; }
            await api(`/api/temp-requests?eventId=${eventId}&userId=${userId}&purpose=reservation&ttlSeconds=${ttl}`, {
                method: 'POST'
            });
            loadTempRequests();
        }

        async function deleteTempRequest(id) {
            await api(`/api/temp-requests/${id}`, { method: 'DELETE' });
            loadTempRequests();
        }

        // --- MANAGERS ---
        async function loadManagers() {
            managersCache = await api('/api/managers');
            document.getElementById('manager-form').style.display = 'flex';
            const tbody = document.getElementById('managers-body');
            if (!managersCache.length) { tbody.innerHTML = '<tr><td colspan="3" class="empty">Нет менеджеров</td></tr>'; return; }
            tbody.innerHTML = managersCache.map(m => `
                <tr>
                    <td>${esc(m.name)}</td>
                    <td>${esc(m.email)}</td>
                    <td>${m.active ? 'Да' : 'Нет'}</td>
                </tr>
            `).join('');
        }

        async function createManager() {
            const name = document.getElementById('mgr-name').value;
            const email = document.getElementById('mgr-email').value;
            if (!name || !email) { alert('Заполните все поля'); return; }
            await api('/api/managers', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, email })
            });
            document.getElementById('mgr-name').value = '';
            document.getElementById('mgr-email').value = '';
            loadManagers();
        }

        // --- SETTINGS ---
        async function loadSettings() {
            const userId = document.getElementById('set-user').value;
            if (!userId) return;
            const s = await api(`/api/settings/${userId}`);
            document.getElementById('set-cat').value = s.preferredCategory || '';
            document.getElementById('set-lang').value = s.language || '';
            document.getElementById('set-notif').value = s.notificationsEnabled;
            document.getElementById('set-perpage').value = s.maxResultsPerPage;
            document.getElementById('settings-fields').style.display = 'flex';
        }

        async function saveSettings() {
            const userId = document.getElementById('set-user').value;
            await api(`/api/settings/${userId}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    preferredCategory: document.getElementById('set-cat').value,
                    language: document.getElementById('set-lang').value,
                    notificationsEnabled: document.getElementById('set-notif').value === 'true',
                    maxResultsPerPage: parseInt(document.getElementById('set-perpage').value) || 20
                })
            });
            loadSettings();
        }

        function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

        loadEvents();
    </script>
</body>
</html>
