server.port=8081

spring.application.name=library-events-service

# Active profile: "inmemory" or "etcd"
# Run with: --spring.profiles.active=etcd  or  --spring.profiles.active=inmemory
spring.profiles.active=inmemory

# Cache configuration
spring.cache.type=simple

# Logging
logging.level.root=INFO
logging.level.ru.library.event=DEBUG
logging.level.com.coreos.jetcd=WARN

# Etcd configuration
etcd.endpoints=http://localhost:2379
etcd.namespace=library
